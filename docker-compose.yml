version: "3.9"

services:
  db:
    image: postgres:16
    container_name: smart_restaurant_postgres_db
    env_file:
      - .env
    volumes:
    - postgres_data:/var/lib/postgresql/data/
    restart: always

  api:
    build: .
    container_name: smart_api
    env_file:
      - .env
    ports:
    - 8000:8000
    volumes:
    - ./:/app
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./media/:/app/media/
      - ./staticfiles/:/app/staticfiles/
    depends_on:
      - api

volumes:
   postgres_data: